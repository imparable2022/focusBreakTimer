name: Test and build NVDA add-on
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build add-on
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: focusBreakTimer-addon
          path: dist/*.nvda-addon
          if-no-files-found: error
